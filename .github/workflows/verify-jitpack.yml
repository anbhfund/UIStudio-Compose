name: Verify JitPack release (clean external consumer)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released tag to test"
        default: "v0.9.0"

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build the Notes app against the JitPack artifact
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: gradle -p examples/notes-consumer :app:assembleDebug --refresh-dependencies --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Notes-consumer-from-JitPack
          path: examples/notes-consumer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
